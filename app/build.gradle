import groovy.json.JsonSlurper
import java.awt.RenderingHints
import java.awt.geom.RoundRectangle2D
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

plugins {
    id 'com.android.application'
}

def sourceResDir = file('src/main/res')
def roundedIconRule = file('src/main/res/drawable-nodpi/make_round_png.json')
def generatedResDir = layout.buildDirectory.dir('generated/jetnote-res').get().asFile

android {
    namespace 'com.ingeniousidea.space'
    compileSdk 34

    defaultConfig {
        applicationId "com.ingeniousidea.space"
        minSdk 23
        targetSdk 34
        versionCode 28
        versionName "3.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The source tree keeps the JSON rule; Android consumes the generated resource mirror.
            res.srcDirs = [generatedResDir]
        }
    }
}

def generateJetNoteResources = tasks.register('generateJetNoteResources') {
    group = 'build setup'
    description = 'Copies Android resources and generates the rounded launcher icon from make_round_png.json.'
    inputs.dir(sourceResDir)
    inputs.file(roundedIconRule)
    outputs.dir(generatedResDir)

    doLast {
        delete(generatedResDir)
        copy {
            from(sourceResDir)
            into(generatedResDir)
            exclude 'drawable-nodpi/make_round_png.json'
            exclude 'drawable-nodpi/icon_rounded.png'
        }

        def rule = new JsonSlurper().parse(roundedIconRule)
        def sourceFile = new File(roundedIconRule.parentFile, String.valueOf(rule.source))
        def outputName = String.valueOf(rule.output)
        int outputSize = Math.max(1, ((Number) (rule.outputSize ?: 1254)).intValue())
        int requestedCornerRadius = ((Number) (rule.cornerRadius ?: outputSize.intdiv(5))).intValue()
        int cornerRadius = Math.max(0, Math.min(outputSize.intdiv(2), requestedCornerRadius))
        if (!sourceFile.isFile()) throw new GradleException("Rounded icon source is missing: ${sourceFile}")
        if (!outputName.matches('[A-Za-z0-9_]+\\.png')) throw new GradleException("Invalid rounded icon output: ${outputName}")

        BufferedImage input = ImageIO.read(sourceFile)
        if (input == null) throw new GradleException("Unsupported icon image: ${sourceFile}")
        BufferedImage output = new BufferedImage(outputSize, outputSize, BufferedImage.TYPE_INT_ARGB)
        def graphics = output.createGraphics()
        try {
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.clip(new RoundRectangle2D.Double(0, 0, outputSize, outputSize, cornerRadius * 2d, cornerRadius * 2d))
            double scale = Math.max(outputSize / (double) input.width, outputSize / (double) input.height)
            int width = (int) Math.round(input.width * scale)
            int height = (int) Math.round(input.height * scale)
            int drawX = (outputSize - width).intdiv(2)
            int drawY = (outputSize - height).intdiv(2)
            graphics.drawImage(input, drawX, drawY, width, height, null)
        } finally {
            graphics.dispose()
        }

        def outputFile = new File(generatedResDir, "drawable-nodpi/${outputName}")
        outputFile.parentFile.mkdirs()
        if (!ImageIO.write(output, 'png', outputFile)) throw new GradleException('PNG encoder is unavailable')
    }
}

tasks.configureEach {
    // R.java can be requested before merge resources on some Android Gradle
    // task graphs, so every consumer of the generated resource tree depends on it.
    def consumesGeneratedResources =
            name == 'preBuild' ||
            name.endsWith('PreBuild') ||
            (name.startsWith('merge') && name.endsWith('Resources')) ||
            (name.startsWith('generate') && name.endsWith('RFile')) ||
            (name.startsWith('compile') && name.endsWith('JavaWithJavac'))
    if (consumesGeneratedResources) dependsOn(generateJetNoteResources)
}
