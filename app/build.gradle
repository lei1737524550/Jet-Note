plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ingeniousidea.space'
    compileSdk 36

    defaultConfig {
        applicationId "com.ingeniousidea.space"
        minSdk 23
        targetSdk 34
        versionCode 176
        versionName "8.0.6"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}




dependencies {
}
