<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jet Note — Settings static demo</title><style>
:root{--border:#bfc1c4;--bg:#fff;--ink:#111;--bar:#fff}*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;background:var(--bg);color:var(--ink)}.screen{position:fixed;inset:0;background:var(--bg);overflow:hidden}.bar{position:absolute;top:0;left:0;width:100%;height:50px;background:var(--bar);border-bottom:1px solid #eceef1;box-shadow:0 2px 4px #0000001a}.title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px}.back{position:absolute;left:44px;top:7px;transform:translateX(-50%);width:48px;height:36px;border:1px solid var(--border);border-radius:14px;background:#fff;display:grid;place-items:center}.back svg{width:24px;height:24px}.body{position:absolute;left:0;right:0;top:50px;bottom:0;overflow:auto;padding:24px 8px 16px}.card{width:100%;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:18px}.row-title{padding:18px 18px 12px;font-size:18px;font-weight:600}.small{min-width:72px;height:38px;padding:6px 14px;border:1px solid var(--border);border-radius:14px;background:#fff;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px 12px}.choice{min-height:74px;padding:11px;border:1px solid var(--border);border-radius:14px;background:#fff;font-size:16px;font-weight:500;text-align:center}.disabled{opacity:.42}.static-note{position:fixed;right:8px;bottom:8px;font-size:10px;color:#aaa;background:#fff;padding:3px 6px;border-radius:8px}@media(min-width:720px){.body{max-width:700px;left:50%;right:auto;width:700px;transform:translateX(-50%)}}
</style></head><body><section class="screen"><header class="bar"><button class="back"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M30 9 15 24l15 15"/></svg></button><div class="title">Settings</div></header><main class="body"><section class="card"><div class="title-row"><div class="row-title">Backup</div><button class="small disabled">Stop</button></div><div class="grid"><button class="choice">Export .jnote</button><button class="choice">Export .jnote<br>(with config folder)</button><button class="choice">Import .jnote</button></div></section><section class="card"><div class="title-row"><div class="row-title">Browser</div><button class="small">Relaunch</button></div><div class="grid"><button class="choice">Enable Browser</button><button class="choice">Enable res-Filter</button></div></section><section class="card"><div class="row-title">Debug</div><div class="grid"><button class="choice">Enable Debug</button><button class="choice">Save JSON</button></div></section></main></section><div class="static-note">Static maintenance demo</div></body></html>
