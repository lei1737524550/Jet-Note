<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jet Note — Home static demo</title><style>
:root{--bg:#fff;--body:#fff;--border:#bfc1c4;--ink:#111214;--muted:#999da2;--pad:8px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;color:inherit}.phone{width:100%;min-height:100vh;padding:14px 0 16px}.status{position:relative;width:calc(100% - 16px);height:52px;margin:0 8px;transform:translateY(-40px);font-size:16px}.battery{position:absolute;left:7%;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:7px}.battery svg{width:30px;height:30px;transform:rotate(90deg)}.time{position:absolute;right:25%;top:50%;transform:translateY(-50%);white-space:nowrap}.gear{position:absolute;left:87.5%;top:50%;transform:translate(-50%,-50%);border:0;background:transparent;width:44px;height:44px;padding:9px}.gear svg{width:26px;height:26px}.world{position:relative;top:-32px;margin-bottom:-32px}.home-actions{padding:8px var(--pad)}.main{padding:0 var(--pad)}.composer-wrap{padding:0 var(--pad);margin-bottom:8px}.box{border:1px solid var(--border);border-radius:14px;background:var(--body)}.post{position:relative;width:100%;margin:0 0 6px;padding:12px 12px 14px;font-size:17px;line-height:1.5}.more{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:transparent;font-size:24px}.stamp{margin:3px 0;color:var(--muted);font-size:12px}.composer{display:flex;align-items:center;min-height:54px;overflow:hidden}.composer .write{flex:1;min-height:52px;border:0;background:transparent;text-align:left;padding:10px 14px;color:#9da0a4;font-size:16px}.media{width:48px;height:48px;border:0;background:transparent;padding:10px}.media svg{width:26px;height:26px}.super .stamp{margin-top:10px}.hint{color:#444}.static-note{position:fixed;right:8px;bottom:8px;font-size:10px;color:#aaa;background:#fff;padding:3px 6px;border-radius:8px}@media(min-width:720px){.home-actions,.main,.composer-wrap{max-width:700px;margin-left:auto;margin-right:auto}}
</style></head><body><div class="phone"><section class="status"><div class="battery"><svg viewBox="0 0 40 20"><rect x="1" y="2" width="34" height="16" rx="3" fill="none" stroke="#111" stroke-width="2"/><rect x="36" y="7" width="3" height="6" rx="1" fill="#111"/><rect x="4" y="5" width="24" height="10" rx="1" fill="#111"/></svg><span>75%</span></div><span class="time">2026/09/17-08-24</span><button class="gear"><svg viewBox="0 0 24 24"><path d="M19.1 12.9c.1-.6.1-1.2 0-1.8l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.6-.9L14.8 3h-4l-.4 2.6a8 8 0 0 0-1.6.9l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 1.9l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.6.9l.4 2.6h4l.4-2.6a8 8 0 0 0 1.6-.9l2.4 1 2-3.4-2.1-1.6ZM12.8 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button></section><div class="world"><div class="home-actions"><article class="post box super"><button class="more">•••</button><div>Jet Note</div><div class="stamp">2026/09/17-08-20</div></article></div><div class="composer-wrap"><div class="composer box"><button class="write">Write something...</button><button class="media"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1"><rect x="7" y="11" width="25" height="26" rx="5"/><path d="M32 19l9-5v20l-9-5z"/></svg></button><button class="media"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1"><rect x="7" y="7" width="34" height="34" rx="6"/><circle cx="18" cy="18" r="3.4"/><path d="M10 35l9-9 7 6 5-5 8 8"/></svg></button><button class="media"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1"><path d="M19 36V13l20-4v23"/><circle cx="14" cy="36" r="5"/><circle cx="34" cy="32" r="5"/></svg></button></div></div><main class="main"><article class="post box"><button class="more">•••</button><div>This is a static Post surface.</div><div class="stamp">2026/09/17-08-18</div></article><article class="post box"><button class="more">•••</button><div>Home uses the same Post geometry for published entries.</div><div class="stamp">2026/09/17-08-16</div></article></main></div></div><div class="static-note">Static maintenance demo</div></body></html>
