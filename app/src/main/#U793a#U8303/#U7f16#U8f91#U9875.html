<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jet Note — Editor static demo</title><style>
:root{--border:#bfc1c4;--bg:#fff;--blue:#1599e8}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#111;background:var(--bg)}.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}.bar{position:relative;width:100%;height:50px;flex:0 0 50px;border-bottom:1px solid #eceef1;box-shadow:0 2px 4px #0000001a}.title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px}.ctl{position:absolute;top:7px;width:48px;height:36px;border:1px solid var(--border);border-radius:14px;background:#fff;display:grid;place-items:center}.left{left:44px;transform:translateX(-50%)}.right{right:44px;transform:translateX(50%);color:var(--blue)}.ctl svg{width:24px;height:24px}.body{flex:1;min-height:0;padding:22px 20px 16px;overflow:hidden}.input-row{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:12px}.text{border:0;outline:0;font-size:17px;line-height:1.55;color:#a5a8ad;white-space:pre-wrap}.attachments{height:96px;display:flex;flex-direction:column}.attach-row{height:48px}.tools{min-height:48px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tool{height:44px;min-width:48px;padding:0 12px;border:1px solid var(--border);border-radius:14px;background:#fff;display:flex;align-items:center;gap:7px;font-size:14px}.tool svg{width:25px;height:25px}.static-note{position:fixed;right:8px;bottom:8px;font-size:10px;color:#aaa;background:#fff;padding:3px 6px;border-radius:8px}
</style></head><body><section class="screen"><header class="bar"><button class="ctl left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="title">New Post</div><button class="ctl right"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-6.8 18-3.1-7.2L3 11.5Zm9.2.8 1.8 4.1 3.5-9.2-9.3 4.4 4 .7Z"/></svg></button></header><main class="body"><div class="input-row"><div class="text">Write something...</div><div class="attachments"><div class="attach-row"></div><div class="attach-row"></div></div><div class="tools"><button class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3z"/></svg>Video</button><button class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg>Images</button><button class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Music</button><button class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8"><path d="M8 7V5.8C8 4.8 8.8 4 9.8 4h4.4C15.2 4 16 4.8 16 5.8V7"/><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M3 12.5h18M9.5 12.5v2h5v-2"/></svg>Tools</button></div></div></main></section><div class="static-note">Static maintenance demo</div></body></html>
