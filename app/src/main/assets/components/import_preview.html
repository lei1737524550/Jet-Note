<!-- Import preview dialog -->
<div id="importPreview" class="import-preview" role="dialog" aria-modal="true">
  <div class="import-panel common_border"><h3 data-i18n="importArchive">Import backup</h3><p id="importSummary"></p>
    <label for="importMode" data-i18n="importMode">Import mode</label>
    <select class="common_border" id="importMode"><option value="merge" data-i18n="merge">Merge (prefer newer entries)</option><option value="add" data-i18n="addOnly">Add missing entries only</option><option value="replace" data-i18n="replaceAll">Replace all posts</option></select>
    <p data-i18n="replaceWarning">Replace overwrites all posts. Merge keeps newer local entries.</p>
    <button class="common_border" onclick="closeImportPreview()" data-i18n="cancel">Cancel</button><button class="common_border" onclick="confirmArchiveImport()" data-i18n="confirmImport">Confirm import</button>
  </div></div>
