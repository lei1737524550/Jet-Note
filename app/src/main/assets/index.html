<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">

<title>Jet Note</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/attachments.css">
</head>

<body>
<div id="startupLoading" class="startup-loading" aria-live="polite">
  <div class="startup-loading-panel">
    <div class="startup-loading-title" id="startupLoadingLabel">Downloading…</div>
    <div class="startup-loading-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="startup-loading-fill" id="startupLoadingFill"></div>
    </div>
    <div class="startup-loading-percent" id="startupLoadingPercent">0%</div>
  </div>
</div>
<script>
(function(){
  window.JetNoteStartupLoader={startedAt:Date.now(),language:'en'};
  document.documentElement.classList.add('startup-loading-active');
  var label=document.getElementById('startupLoadingLabel');if(label)label.textContent='Downloading…';
})();
</script>
<div id="stage">
<div class="phone" id="phone">

  <section class="header"><div class="wave3"></div></section>

  <div class="home-actions" aria-label="Home actions">
    <button class="home-action-button" onclick="openSettings()" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94L14.4 2.81A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.72 8.47a.49.49 0 0 0 .12.61l2.03 1.58c-.05.31-.08.65-.08.97 0 .31.03.62.07.92l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.31.59.22l2.39-.96c.5.39 1.04.71 1.62.95l.36 2.53c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.53c.58-.24 1.12-.56 1.62-.95l2.39.96c.22.09.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
    </button>
  </div>
  <div class="composer-area" id="mainComposerArea">
    <div class="composer common_border">
      <button class="composer-main" type="button" data-editor-open="create" data-i18n="share" data-i18n-mode="text">Share something...</button>
      <button class="composer-photo" onclick="openPostComposerWithVideoPicker()" aria-label="add video">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="11" width="25" height="26" rx="5"/>
          <path d="M32 19l9-5v20l-9-5z"/>
        </svg>
      </button>
      <button class="composer-photo" onclick="openPostComposerWithImagePicker()" aria-label="add image">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="7" width="34" height="34" rx="6"/>
          <circle cx="18" cy="18" r="3.4"/>
          <path d="M10 35l9-9 7 6 5-5 8 8"/>
        </svg>
      </button>
      <button class="composer-photo" onclick="openPostComposerWithAudioPicker()" aria-label="add audio">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 36V13l20-4v23"/><circle cx="14" cy="36" r="5"/><circle cx="34" cy="32" r="5"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="feed" id="postList"></main>




  <!-- Runtime fragment mount points. HTML pages remain separate in source,
       but are mounted into the same WebView/document before application scripts start. -->
  <div id="pageMount"></div>
  <div id="overlayMount"></div>
  <div class="jet-scrollbar" id="jetScrollbar" aria-hidden="true"><div class="jet-scrollbar-track"><div class="jet-scrollbar-thumb"></div></div></div>

</div>
</div>

<script src="js/core/view_loader.js"></script>
<script>
(async function startJetNoteFrontend() {
  try {
    await window.JetNoteViewLoader.mountAll({
      pageMount: 'pageMount',
      overlayMount: 'overlayMount',
      pages: [
        'pages/settings.html',
        'pages/post_composer.html'
      ],
      components: [
        'components/image_viewer.html',
        'components/delete_confirm_dialog.html',
        'components/post_action_sheet.html',
        'components/import_preview.html'
      ]
    });

    await window.JetNoteViewLoader.loadScripts([
      'js/components/notice.js',
      'js/components/jet_topbar.js',
      'js/components/jet_scrollbar.js',
      'vendor/fflate.js',
      'vendor/sha256.js',
      'js/data/post_store.js',
      'js/features/post_audio.js',
      'js/archive/media_adapter.js',
      'js/archive/archive_mapping.js',
      'js/archive/archive.js',
      'js/features/import_export.js',
      'js/core/storage.js',
      'js/core/dom.js',
      'js/components/post_menu_icon.js',
      'js/core/viewport.js',
      'js/core/language.js',
      'js/features/settings_page.js',
      'js/core/editor_controller.js',
      'js/features/tools.js',
      'js/components/post_media.js',
      'js/components/image_viewer.js',
      'js/components/delete_confirm_dialog.js',
      'js/features/posts.js',
      'js/core/navigation.js',
      'js/features/appearance.js',
      'js/core/bootstrap.js',
    ]);
  } catch (error) {
    console.error('Jet Note frontend startup failed:', error);
    document.documentElement.classList.remove('startup-loading-active');
    const loading = document.getElementById('startupLoading');
    if (loading) loading.hidden = true;

    const panel = document.createElement('main');
    panel.style.cssText = 'padding:24px;font-family:sans-serif;line-height:1.6;background:#fff;min-height:100vh';
    const section = document.createElement('section');
    section.style.cssText = 'max-width:560px;margin:48px auto;padding:20px;border:1px solid #c8cdd2;border-radius:16px;background:#fff';
    const title = document.createElement('strong');
    title.style.color = '#b3261e';
    title.textContent = 'Interface initialization failed';
    const message = document.createElement('div');
    message.style.cssText = 'margin-top:10px;overflow-wrap:anywhere';
    message.textContent = error && error.message ? error.message : String(error);
    section.append(title, message);
    panel.appendChild(section);
    document.body.appendChild(panel);
  }
})();
</script>
</body>
</html>
