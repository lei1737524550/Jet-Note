<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Jet Note</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/attachments.css">
</head>

<body>
<div id="startupLoading" class="startup-loading" aria-live="polite">
  <div class="startup-loading-panel">
    <div class="startup-loading-title" id="startupLoadingLabel">Downloading…</div>
    <div class="startup-loading-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="startup-loading-fill" id="startupLoadingFill"></div>
    </div>
    <div class="startup-loading-percent" id="startupLoadingPercent">0%</div>
  </div>
</div>
<script>
(function(){
  window.JetNoteStartupLoader={startedAt:Date.now(),language:'en'};
  document.documentElement.classList.add('startup-loading-active');
  var label=document.getElementById('startupLoadingLabel');if(label)label.textContent='Downloading…';
})();
</script>
<div id="stage">
<div class="phone" id="phone">

  <section class="header"><div class="wave3"></div></section>

  <div class="home-actions" aria-label="Home actions">
    <button class="home-action-button" onclick="openSettings()" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94L14.4 2.81A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.72 8.47a.49.49 0 0 0 .12.61l2.03 1.58c-.05.31-.08.65-.08.97 0 .31.03.62.07.92l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.31.59.22l2.39-.96c.5.39 1.04.71 1.62.95l.36 2.53c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.53c.58-.24 1.12-.56 1.62-.95l2.39.96c.22.09.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
    </button>
    <button class="home-action-button" onclick="openTools()" aria-label="Tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7V5.8C8 4.8 8.8 4 9.8 4h4.4C15.2 4 16 4.8 16 5.8V7"/><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M3 12.5h18M9.5 12.5v2h5v-2"/></svg>
    </button>
  </div>
  <div class="composer-area" id="mainComposerArea">
    <div class="composer">
      <button class="composer-main" onclick="openPostComposer()" data-i18n="share" data-i18n-mode="text">Share something...</button>
      <button class="composer-photo" onclick="openPostComposerWithAudioPicker()" aria-label="add audio">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 36V13l20-4v23"/><circle cx="14" cy="36" r="5"/><circle cx="34" cy="32" r="5"/>
        </svg>
      </button>
      <button class="composer-photo" onclick="openPostComposerWithImagePicker()">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="7" width="34" height="34" rx="6"/>
          <circle cx="18" cy="18" r="3.4"/>
          <path d="M10 35l9-9 7 6 5-5 8 8"/>
        </svg>
      </button>
      <button class="composer-photo" onclick="openPostComposerWithVideoPicker()" aria-label="add video">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="11" width="25" height="26" rx="5"/>
          <path d="M32 19l9-5v20l-9-5z"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="feed" id="postList"></main>




  <!-- Full-screen image / video viewer -->
  <div class="image-viewer" id="imageViewer" onclick="closeImageViewer(event)">
    <button class="image-viewer-close"
            onclick="closeImageViewer(event)"
            aria-label="close">×</button>
    <img id="imageViewerImg" src="" alt="">
    <video id="imageViewerVideo" controls playsinline preload="metadata"></video>
  </div>


  <input id="postAudioPicker" type="file" accept="audio/*,.mp3" multiple hidden onchange="handleAudioFiles(event,'post')">
  <input id="archivePicker" type="file" accept=".jnote,.jet-note,application/vnd.jnote+zip,application/vnd.jet-note+zip,application/zip,application/octet-stream" hidden onchange="selectArchive(event)">
  <!-- Settings panel -->
  <section class="settings-screen" id="settingsScreen">
    <div class="settings-header">
      <button class="settings-back" onclick="closeSettings()" aria-label="Back">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 9L15 24l15 15"/>
        </svg>
      </button>
      <div class="settings-title" data-i18n="settings">Settings</div>
    </div>

    <div class="settings-body">
      <div class="settings-card backup-card" id="backupSettingsCard">
        <div class="settings-row-title">Backup</div>
        <div class="settings-option-grid">
          <button class="settings-choice settings-action-choice" onclick="exportArchive()"><span class="settings-choice-main">Export .jnote</span></button>
          <button class="settings-choice settings-action-choice" onclick="chooseArchive()"><span class="settings-choice-main">Import .jnote</span></button>
        </div>
        <p id="archiveStatus" role="status"></p>
        <div id="archiveProgress" class="archive-progress" hidden aria-live="polite"><div class="archive-progress-head"><span id="archiveProgressLabel">Preparing…</span><span id="archiveProgressPercent">0%</span></div><div class="archive-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="archiveProgressFill" class="archive-progress-fill"></div></div><div id="archiveProgressBytes" class="archive-progress-bytes"></div></div>
      </div>
      <div class="settings-card" id="backgroundAppearanceCard">
        <div class="settings-row-title">Background</div>
        <div class="rgb-editor open" id="backgroundRgbEditor">
          <div class="rgb-inputs"><label>R<input id="backgroundR" type="number" inputmode="numeric" min="0" max="255" value="255"></label><label>G<input id="backgroundG" type="number" inputmode="numeric" min="0" max="255" value="255"></label><label>B<input id="backgroundB" type="number" inputmode="numeric" min="0" max="255" value="255"></label></div>
          <button class="rgb-apply" onclick="saveRgbBackground()">Apply</button>
        </div>
        <p class="settings-status" id="appearanceStatus" role="status"></p>
      </div>
    </div>
  </section>



  <!-- Custom delete confirmation -->
  <div class="delete-confirm-backdrop"
       id="deleteConfirmBackdrop"
       onclick="handleDeleteConfirmBackdrop(event)">
    <div class="delete-confirm-panel" role="dialog" aria-modal="true">
      <div class="delete-confirm-message" id="deleteConfirmMessage"></div>

      <div class="delete-confirm-actions">
        <button class="delete-confirm-btn"
                type="button"
                onclick="cancelDeleteConfirm()">
          <svg viewBox="0 0 48 48" fill="none" stroke="#222" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 14l20 20M34 14L14 34"/>
          </svg>
          <span data-i18n="cancel">Cancel</span>
        </button>

        <button class="delete-confirm-btn delete"
                type="button"
                onclick="confirmPendingDelete()">
          <svg viewBox="0 0 48 48" fill="none" stroke="#d93636" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 14h28"/>
            <path d="M18 14V9h12v5"/>
            <path d="M15 14l2 25h14l2-25"/>
            <path d="M21 20v13M27 20v13"/>
          </svg>
          <span data-i18n="delete">Delete</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Post action panel -->
  <div class="post-action-panel" id="postActionPanel">
    <button class="post-action-btn" onclick="editActivePost()">
      <svg class="post-action-icon" viewBox="0 0 48 48" fill="none" stroke="#222" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 35l3-10L31 8l9 9-17 17-12 1z"/>
        <path d="M28 11l9 9"/>
        <path d="M14 25l9 9"/>
      </svg>
      <span class="post-action-label" data-i18n="edit">Edit</span>
    </button>

    <button class="post-action-btn delete" onclick="deleteActivePost()">
      <svg class="post-action-icon" viewBox="0 0 48 48" fill="none" stroke="#d93636" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 14h28"/>
        <path d="M18 14V9h12v5"/>
        <path d="M15 14l2 25h14l2-25"/>
        <path d="M21 20v13M27 20v13"/>
      </svg>
      <span class="post-action-label" data-i18n="delete">Delete</span>
    </button>
  </div>

  <!-- 文本说说Edit器 -->
  <section class="settings-screen tools-screen" id="toolsScreen">
    <div class="settings-header"><button class="settings-back" onclick="closeTools()" aria-label="Back"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M30 9L15 24l15 15"/></svg></button><div class="settings-title">Tools</div></div>
    <div class="settings-body tools-body"><div class="settings-card"><div class="tools-grid">
      <button class="tool-choice" onclick="closeTools();openDictionary()"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><path d="M24 10Q12 4 6 8v31q8-4 18 2 10-6 18-2V8q-7-4-18 2v31"/></svg><span>Dictionary</span></button>
      <button class="tool-choice" onclick="closeTools();openSentences()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H9l-5 4V5Z"/><path d="M8 9h8M8 13h5"/></svg><span>Sentences</span></button>
    </div></div></div>
  </section>
  <section class="post-compose-screen" id="postComposeScreen">
    <div class="post-compose-header">
      <button class="post-compose-cancel" onclick="closePostComposer()" data-i18n="cancel">Cancel</button>
      <div class="post-compose-title" data-i18n="writePost">New Post</div>
      <button class="post-compose-publish" onclick="publishTextPost()" data-i18n="publish">Post</button>
    </div>

    <div class="post-compose-body">
      <div class="post-input-row">
        <textarea id="postComposerText" maxlength="5000" placeholder="Share something..." data-i18n-placeholder="share" oninput="updatePostCount()"></textarea>
        <div class="compose-media-toolbar" aria-label="Add attachments">
          <button class="compose-add-image" type="button" data-add-audio="post" onclick="pickEntryAudio('post')" title="Add music">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span data-i18n="addAudio">Add music</span>
          </button>
          <button class="compose-add-image" type="button" onclick="pickPostImages()" title="Add images">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg><span data-i18n="addImage">Add images</span>
          </button>
          <button class="compose-add-image" type="button" data-add-video="post" onclick="pickPostVideos()" title="Add video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3z"/></svg><span data-i18n="addVideo">Add video</span>
          </button>
        </div>
      </div>
      <div id="postAudioDraft"></div>
      <div class="compose-image-preview post-compose-images" id="postImagePreview"></div>
      <div class="compose-video-preview post-compose-videos" id="postVideoPreview"></div>

      <div class="post-compose-count"><span id="postCharCount">0</span>/5000</div>
    </div>
  </section>

  <input id="postImagePicker"
         type="file"
         accept="image/*"
         multiple
         style="display:none"
         onchange="handlePostImages(event)">
  <input id="postVideoPicker"
         type="file"
         accept="video/*"
         multiple
         style="display:none"
         onchange="handlePostVideos(event)">

  <!--  -->

</div>
</div>

<script src="js/components/notice.js"></script>
<script src="vendor/fflate.js"></script>
<script src="vendor/sha256.js"></script>
<script src="js/core/entries.js"></script>
<script src="js/features/audio.js"></script>
<script src="js/core/media-adapter.js"></script>
<script src="js/core/archive-mapping.js"></script>
<script src="js/core/archive.js"></script>
<script src="js/features/transfer.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/components/menu.js"></script>
<script src="js/core/viewport.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/features/settings.js"></script>
<script src="js/components/media.js"></script>
<script src="js/components/viewer.js"></script>
<script src="js/components/confirmation.js"></script>
<script src="js/features/posts.js"></script>
<script src="js/core/navigation.js"></script>
<script src="js/features/appearance.js"></script>
<script src="js/core/bootstrap.js"></script>
<div id="importPreview" class="import-preview" role="dialog" aria-modal="true">
  <div class="import-panel"><h3 data-i18n="importArchive">Import backup</h3><p id="importSummary"></p>
    <label for="importMode" data-i18n="importMode">Import mode</label>
    <select id="importMode"><option value="merge" data-i18n="merge">Merge (prefer newer entries)</option><option value="add" data-i18n="addOnly">Add missing entries only</option><option value="replace" data-i18n="replaceAll">Replace all posts</option></select>
    <p data-i18n="replaceWarning">Replace overwrites all posts. Merge keeps newer local entries.</p>
    <button onclick="closeImportPreview()" data-i18n="cancel">Cancel</button><button onclick="confirmArchiveImport()" data-i18n="confirmImport">Confirm import</button>
  </div></div>
</body>
</html>
