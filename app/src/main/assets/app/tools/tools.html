<!-- Tools page fragment -->
<section class="settings-screen tools-screen" id="toolsScreen">
    <div class="page-action-bar tools-header buttom-string-buttom-bar" data-buttom-string-buttom-bar-page="tools_page">
        <button class="page-action-bar-control page-action-bar-left common_border tools-back" type="button" data-buttom-string-buttom-bar-side="left"></button>
        <div class="page-action-bar-title tools-title" data-buttom-string-buttom-bar-title></div>
        <button class="page-action-bar-control page-action-bar-right common_border" type="button" data-buttom-string-buttom-bar-side="right"></button>
    </div>
    <div class="settings-body tools-body">
        <div class="settings-card common_border">
            <div class="tools-grid">
                <button class="tool-choice common_border" onclick="openDictionaryFromPostTools()">
                    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
                        <path d="M24 10Q12 4 6 8v31q8-4 18 2 10-6 18-2V8q-7-4-18 2v31"/>
                    </svg>
                    <span>Dictionary</span>
                </button>
                <button class="tool-choice common_border" onclick="openSentencesFromPostTools()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 5h16v12H9l-5 4V5Z"/>
                        <path d="M8 9h8M8 13h5"/>
                    </svg>
                    <span>Sentences</span>
                </button>
            </div>
        </div>
    </div>
</section>
