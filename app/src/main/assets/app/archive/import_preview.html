<!-- Import preview dialog -->
<div id="importPreview" class="import-preview" role="dialog" aria-modal="true">
  <div class="import-panel common_border">
    <h3 data-language-text="importArchive"></h3>
    <p id="importSummary"></p>
    <div class="import-mode-label" data-language-text="importMode"></div>
    <input id="importMode" type="hidden" value="merge">
    <div id="importModeChoices" class="import-mode-choices" role="radiogroup" aria-label="" data-language-aria-label="importMode">
      <button type="button" class="import-mode-choice common_border" data-import-mode="add" data-language-text="addOnly" onclick="selectImportMode('add')"></button>
      <button type="button" class="import-mode-choice common_border" data-import-mode="merge" data-language-text="merge" onclick="selectImportMode('merge')"></button>
      <button type="button" class="import-mode-choice common_border" data-import-mode="replace" data-language-text="replaceAll" onclick="selectImportMode('replace')"></button>
    </div>
    <p class="import-mode-help" data-language-text="replaceWarning"></p>
    <div class="import-dialog-actions">
      <button class="common_border" onclick="closeImportPreview()" data-language-text="cancel"></button>
      <button class="common_border" onclick="confirmArchiveImport()" data-language-text="confirmImport"></button>
    </div>
  </div>
</div>
