<!-- Import preview dialog -->
<div id="importPreview" class="import-preview" role="dialog" aria-modal="true">
  <div class="import-panel common_border"><h3 data-language-text="importArchive"></h3><p id="importSummary"></p>
    <label for="importMode" data-language-text="importMode"></label>
    <select class="common_border" id="importMode"><option value="merge" data-language-text="merge"></option><option value="add" data-language-text="addOnly"></option><option value="replace" data-language-text="replaceAll"></option></select>
    <p data-language-text="replaceWarning"></p>
    <button class="common_border" onclick="closeImportPreview()" data-language-text="cancel"></button><button class="common_border" onclick="confirmArchiveImport()" data-language-text="confirmImport"></button>
  </div></div>
