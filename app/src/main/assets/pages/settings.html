<!-- Settings page fragment -->
  <section class="settings-screen" id="settingsScreen">
    <div class="settings-header">
      <button class="settings-back" onclick="closeSettings()" aria-label="Back">
        <svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 9L15 24l15 15"/>
        </svg>
      </button>
      <div class="settings-title" data-i18n="settings">Settings</div>
    </div>

    <div class="settings-body">
      <div class="settings-card backup-card common_border" id="backupSettingsCard">
        <div class="settings-row-title">Backup</div>
        <div class="settings-option-grid">
          <button class="settings-choice settings-action-choice common_border" onclick="exportArchive()"><span class="settings-choice-main">Export .jnote</span></button>
          <button class="settings-choice settings-action-choice common_border" onclick="chooseArchive()"><span class="settings-choice-main">Import .jnote</span></button>
        </div>
        <p id="archiveStatus" role="status"></p>
        <div id="archiveProgress" class="archive-progress common_border" hidden aria-live="polite"><div class="archive-progress-head"><span id="archiveProgressLabel">Preparing…</span><span id="archiveProgressPercent">0%</span></div><div class="archive-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="archiveProgressFill" class="archive-progress-fill"></div></div><div id="archiveProgressBytes" class="archive-progress-bytes"></div></div>
      </div>
      <div class="settings-card color-view-card common_border" id="colorViewCard">
        <div class="settings-row-title">Color View</div>
        <div class="color-view-tool common_border">
          <div class="color-view-picker-column">
            <div class="color-view-field common_border" id="colorViewField" role="application" aria-label="Saturation and brightness color field" tabindex="0">
              <div class="color-view-field-handle" id="colorViewFieldHandle" aria-hidden="true"></div>
            </div>
            <div class="color-view-hue-control">
              <div class="color-view-hue common_border" id="colorViewHue" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0" tabindex="0">
                <div class="color-view-hue-handle" id="colorViewHueHandle" aria-hidden="true"></div>
              </div>
              <div class="color-view-hue-caret" id="colorViewHueCaret" aria-hidden="true"></div>
            </div>
          </div>

          <div class="color-view-preview-column">
            <div class="color-view-text-preview common_border" id="colorViewTextPreview1">天地玄黄 宇宙洪荒 龟龙麟凤 日月星辰</div>
            <div class="color-view-text-preview color-view-text-preview-latin common_border" id="colorViewTextPreview2">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>

            <div class="color-view-rgb-grid" aria-label="RGB values">
              <div class="color-view-rgb-label color-view-rgb-label-r">R</div>
              <div class="color-view-rgb-label color-view-rgb-label-g">G</div>
              <div class="color-view-rgb-label color-view-rgb-label-b">B</div>
              <input class="color-view-rgb-value common_border" id="colorViewR" type="number" inputmode="numeric" min="0" max="255" value="255" aria-label="Red">
              <input class="color-view-rgb-value common_border" id="colorViewG" type="number" inputmode="numeric" min="0" max="255" value="0" aria-label="Green">
              <input class="color-view-rgb-value common_border" id="colorViewB" type="number" inputmode="numeric" min="0" max="255" value="0" aria-label="Blue">
            </div>
          </div>

          <div class="color-view-actions">
            <div class="color-view-action-cell"><button class="color-view-action-button common_border" id="colorViewSetBackgroundButton" type="button"></button></div>
            <div class="color-view-action-cell"><button class="color-view-action-button common_border" id="colorViewModeToggleButton" type="button"></button></div>
            <div class="color-view-action-cell"><button class="color-view-action-button common_border" id="colorViewExportButton" type="button"></button></div>
          </div>
          <p class="color-view-status" id="colorViewStatus" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </section>
  <input id="archivePicker" type="file" accept=".jnote,.jet-note,application/vnd.jnote+zip,application/vnd.jet-note+zip,application/zip,application/octet-stream" hidden onchange="selectArchive(event)">
