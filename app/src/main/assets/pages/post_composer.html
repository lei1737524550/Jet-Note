<!-- New Post page fragment -->
  <section class="post-compose-screen" id="postComposeScreen">
    <div class="page-action-bar post-compose-header buttom-string-buttom-bar" data-buttom-string-buttom-bar-page="new_post_page">
      <button class="page-action-bar-control page-action-bar-left common_border post-compose-cancel" type="button" data-buttom-string-buttom-bar-side="left"></button>
      <div class="page-action-bar-title post-compose-title" data-buttom-string-buttom-bar-title></div>
      <button class="page-action-bar-control page-action-bar-right common_border post-compose-publish" type="button" data-buttom-string-buttom-bar-side="right"></button>
    </div>

    <div class="post-compose-body">
      <div class="post-input-row">
        <textarea id="postComposerText" placeholder="Share something..." data-i18n-placeholder="share"></textarea>
        <!-- Rendered from config.json so order and expanded tools stay configurable. -->
        <div class="compose-media-toolbar" id="postComposerToolbar" aria-label="Post tools" data-i18n-aria-label="postTools"></div>
      </div>
      <div id="postAudioDraft"></div>
      <div class="compose-image-preview post-compose-images" id="postImagePreview"></div>
      <div class="compose-video-preview post-compose-videos" id="postVideoPreview"></div>

    </div>
  </section>
  <input id="postAudioPicker" type="file" accept="audio/*,.mp3" multiple hidden onchange="handleAudioFiles(event,'post')">
  <input id="postVideoPicker"
         type="file"
         accept="video/*"
         multiple
         style="display:none"
         onchange="handlePostVideos(event)">
