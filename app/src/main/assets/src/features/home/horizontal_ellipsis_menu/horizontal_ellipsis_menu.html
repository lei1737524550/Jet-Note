<!-- Post action panel -->
  <div class="post-action-panel post-action-menu common_border" id="postActionPanel">
    <button class="post-action-btn post-action-menu-button" type="button" data-post-action="view" aria-label="" data-language-aria-label="viewPost"><img class="post-action-icon post-action-menu-icon" src="src/shared/icons/view_note.svg" alt=""></button>
    <button class="post-action-btn post-action-menu-button archive-book-action" id="postArchiveAction" type="button" data-post-action="archive" aria-label="" data-language-aria-label="archiveAction"><img class="post-action-icon post-action-menu-icon" src="src/shared/icons/post_archive_book.svg" alt=""></button>
    <button class="post-action-btn post-action-menu-button star" id="postStarAction" type="button" data-post-action="star" aria-label="" data-language-aria-label="star" aria-pressed="false">
      <img class="post-action-icon post-action-menu-icon post-action-star" src="src/shared/icons/star.svg" alt="">
    </button>

    <button class="post-action-btn post-action-menu-button" type="button" data-post-action="edit" aria-label="" data-language-aria-label="edit">
      <img class="post-action-icon post-action-menu-icon" src="src/shared/icons/menu_edit_pencil.svg" alt="">
    </button>

    <button class="post-action-btn post-action-menu-button delete" type="button" data-post-action="delete" aria-label="" data-language-aria-label="delete">
      <img class="post-action-icon post-action-menu-icon post-action-trash-icon" src="src/shared/icons/trash.svg" alt="">
    </button>
  </div>
