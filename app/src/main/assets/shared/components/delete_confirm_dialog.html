<!-- Custom delete confirmation -->
  <div class="delete-confirm-backdrop"
       id="deleteConfirmBackdrop"
       onclick="handleDeleteConfirmBackdrop(event)">
    <div class="delete-confirm-panel post-action-menu common_border" role="dialog" aria-modal="true">
      <div class="delete-confirm-message" id="deleteConfirmMessage"></div>
      <div class="delete-confirm-actions post-action-menu-actions">
        <button class="delete-confirm-btn post-action-menu-button common_border" type="button" onclick="cancelDeleteConfirm()" aria-label="Cancel" data-i18n-aria-label="cancel">
          <svg class="delete-confirm-x-icon post-action-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button class="delete-confirm-btn post-action-menu-button delete common_border" type="button" onclick="confirmPendingDelete()" aria-label="Delete" data-i18n-aria-label="delete">
          <img class="delete-confirm-trash-icon post-action-menu-icon" src="shared/icons/trash_can_open.svg" alt="">
        </button>
      </div>
    </div>
  </div>
