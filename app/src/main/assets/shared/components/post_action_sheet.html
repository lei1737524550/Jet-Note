<!-- Post action panel -->
  <div class="post-action-panel post-action-menu common_border" id="postActionPanel">
    <button class="post-action-btn post-action-menu-button" type="button" data-post-action="edit" aria-label="Edit" data-i18n-aria-label="edit">
      <svg class="post-action-icon post-action-menu-icon" viewBox="0 0 48 48" fill="none" stroke="#222" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 35l3-10L31 8l9 9-17 17-12 1z"/>
        <path d="M28 11l9 9"/>
        <path d="M14 25l9 9"/>
      </svg>
    </button>

    <button class="post-action-btn post-action-menu-button favorite" id="postFavoriteAction" type="button" data-post-action="favorite" aria-label="Favorite" data-i18n-aria-label="favorite" aria-pressed="false">
      <svg class="post-action-icon post-action-menu-icon post-action-star" viewBox="0 0 48 48" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 5.5l5.7 11.6 12.8 1.9-9.3 9 2.2 12.7L24 34.7l-11.4 6 2.2-12.7-9.3-9 12.8-1.9L24 5.5z"/>
      </svg>
    </button>

    <button class="post-action-btn post-action-menu-button delete" type="button" data-post-action="delete" aria-label="Delete" data-i18n-aria-label="delete">
      <img class="post-action-icon post-action-menu-icon post-action-trash-icon" src="shared/icons/trash.svg" alt="">
    </button>
  </div>
